<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="header" class="navbar navbar-expand-lg app-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/bulletins}">
            <span class="brand-mark">SG</span>
            <span>SGE</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Basculer la navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div id="mainNav" class="collapse navbar-collapse">
            <div class="navbar-nav ms-lg-4">
                <a class="nav-link" th:href="@{/bulletins}">Bulletins</a>
                <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}">Admin</a>
                <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/etudiants}">Etudiants</a>
                <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/notes}">Notes</a>
            </div>

            <div class="ms-lg-auto mt-3 mt-lg-0 d-flex flex-column flex-lg-row align-items-lg-center gap-2">
                <span class="text-secondary small" sec:authorize="isAuthenticated()">
                    Connecte: <strong th:text="${#authentication.name}">user</strong>
                </span>
                <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                    <button type="submit" class="btn btn-outline-primary btn-sm">Deconnexion</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
