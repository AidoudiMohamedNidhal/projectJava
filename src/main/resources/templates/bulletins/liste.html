<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulletins - SGE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="fragments/header :: header"></div>

    <main class="main-container">
        <div class="page-head">
            <div>
                <p class="eyebrow">Resultats</p>
                <h1 class="page-title">Bulletins scolaires</h1>
                <p class="page-subtitle">Consultez les moyennes, mentions et decisions de chaque etudiant.</p>
            </div>
        </div>

        <section class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Liste des bulletins</h2>
                <span class="text-secondary small" th:text="${bulletins.size()} + ' bulletin(s)'">0 bulletin</span>
            </div>
            <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Etudiant</th>
                        <th>Groupe</th>
                        <th>Filiere</th>
                        <th>Moyenne</th>
                        <th>Mention</th>
                        <th>Statut</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${bulletins.empty}">
                        <td colspan="7" class="empty-state">Aucun bulletin disponible.</td>
                    </tr>
                    <tr th:each="b : ${bulletins}">
                        <td>
                            <div class="fw-semibold" th:text="${b.etudiant.nom + ' ' + b.etudiant.prenom}"></div>
                        </td>
                        <td th:text="${b.etudiant.groupe}"></td>
                        <td th:text="${b.etudiant.filiere != null ? b.etudiant.filiere.nom : 'N/A'}"></td>
                        <td class="fw-semibold" th:text="${#numbers.formatDecimal(b.moyenneGenerale,1,2)}"></td>
                        <td th:text="${b.mention}"></td>
                        <td>
                            <span th:if="${b.admis}" class="badge badge-success">Admis</span>
                            <span th:unless="${b.admis}" class="badge badge-danger">Ajourne</span>
                        </td>
                        <td>
                            <a th:href="@{/bulletins/{id}(id=${b.etudiant.id})}" class="btn btn-primary btn-sm">Voir</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
