<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - SGE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="auth-page">
    <section class="auth-visual">
        <div class="d-flex align-items-center">
            <span class="brand-mark bg-white text-primary">SG</span>
            <strong>SGE</strong>
        </div>
        <div>
            <p class="eyebrow text-white-50">Creation de compte</p>
            <h1>Rejoignez l'espace de gestion des etudiants.</h1>
            <p>Un compte vous donne acces aux pages autorisees selon votre role.</p>
        </div>
    </section>

    <section class="auth-card-wrap">
        <div class="auth-card">
            <span class="brand-mark">SG</span>
            <h2 class="auth-title">Inscription</h2>
            <p class="text-secondary mb-4">Creez vos identifiants de connexion.</p>

            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>
            <div th:if="${success}" class="alert alert-success" role="alert">
                <span th:text="${success}"></span>
            </div>

            <form th:action="@{/register}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Nom d'utilisateur</label>
                    <input id="username" type="text" name="username" class="form-control"
                           placeholder="Choisissez un nom" autocomplete="username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Mot de passe</label>
                    <input id="password" type="password" name="password" class="form-control"
                           placeholder="Choisissez un mot de passe" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">S'inscrire</button>
            </form>

            <p class="mt-4 mb-0 text-secondary">
                Vous avez deja un compte ?
                <a th:href="@{/login}">Se connecter</a>
            </p>
        </div>
    </section>
</main>
</body>
</html>
