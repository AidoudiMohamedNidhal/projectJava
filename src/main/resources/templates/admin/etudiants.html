<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etudiants - SGE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="fragments/header :: header"></div>

    <main class="main-container">
        <div class="page-head">
            <div>
                <p class="eyebrow">Administration</p>
                <h1 class="page-title">Gestion des etudiants</h1>
                <p class="page-subtitle">Inscrivez les etudiants et rattachez-les a leur filiere.</p>
            </div>
            <a th:href="@{/admin/dashboard}" class="btn btn-soft">Dashboard</a>
        </div>

        <section class="panel mb-4">
            <div class="panel-header">
                <h2 class="panel-title">Ajouter un etudiant</h2>
            </div>
            <div class="panel-body">
                <form th:action="@{/admin/etudiants/add}" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label" for="nom">Nom</label>
                            <input id="nom" type="text" name="nom" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="prenom">Prenom</label>
                            <input id="prenom" type="text" name="prenom" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="email">Email</label>
                            <input id="email" type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="cin">CIN</label>
                            <input id="cin" type="text" name="cin" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="dateNaissance">Date de naissance</label>
                            <input id="dateNaissance" type="date" name="dateNaissance" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="groupe">Groupe</label>
                            <input id="groupe" type="text" name="groupe" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="filiereId">Filiere</label>
                            <select id="filiereId" name="filiereId" class="form-select" required>
                                <option value="">Selectionner</option>
                                <option th:each="filiere : ${filieres}"
                                        th:value="${filiere.id}"
                                        th:text="${filiere.nom + ' - ' + filiere.niveau}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">Ajouter l'etudiant</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Liste des etudiants</h2>
                <span class="text-secondary small" th:text="${etudiants.size()} + ' element(s)'">0 element</span>
            </div>
            <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Etudiant</th>
                        <th>Email</th>
                        <th>CIN</th>
                        <th>Groupe</th>
                        <th>Filiere</th>
                        <th>Moyenne</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${etudiants.empty}">
                        <td colspan="8" class="empty-state">Aucun etudiant enregistre.</td>
                    </tr>
                    <tr th:each="etudiant : ${etudiants}">
                        <td th:text="${etudiant.id}"></td>
                        <td>
                            <div class="fw-semibold" th:text="${etudiant.nom + ' ' + etudiant.prenom}"></div>
                        </td>
                        <td th:text="${etudiant.email}"></td>
                        <td th:text="${etudiant.cin}"></td>
                        <td th:text="${etudiant.groupe}"></td>
                        <td th:text="${etudiant.filiere != null ? etudiant.filiere.nom : 'N/A'}"></td>
                        <td th:text="${#numbers.formatDecimal(etudiant.moyenne,1,2)}"></td>
                        <td>
                            <a th:href="@{/admin/etudiants/delete/{id}(id=${etudiant.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Supprimer cet etudiant ?')">Supprimer</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
