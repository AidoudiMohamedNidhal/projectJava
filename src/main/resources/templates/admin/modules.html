<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modules - SGE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="fragments/header :: header"></div>

    <main class="main-container">
        <div class="page-head">
            <div>
                <p class="eyebrow">Administration</p>
                <h1 class="page-title">Gestion des modules</h1>
                <p class="page-subtitle">Definissez les modules, codes et coefficients par filiere.</p>
            </div>
            <a th:href="@{/admin/dashboard}" class="btn btn-soft">Dashboard</a>
        </div>

        <section class="panel mb-4">
            <div class="panel-header">
                <h2 class="panel-title">Ajouter un module</h2>
            </div>
            <div class="panel-body">
                <form th:action="@{/admin/modules/add}" method="post">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label" for="nom">Nom</label>
                            <input id="nom" type="text" name="nom" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label" for="code">Code</label>
                            <input id="code" type="text" name="code" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label" for="coefficient">Coefficient</label>
                            <input id="coefficient" type="number" name="coefficient" class="form-control" min="1" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="filiereId">Filiere</label>
                            <select id="filiereId" name="filiereId" class="form-select" required>
                                <option value="">Selectionner</option>
                                <option th:each="filiere : ${filieres}"
                                        th:value="${filiere.id}"
                                        th:text="${filiere.nom}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">Ajouter</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Liste des modules</h2>
                <span class="text-secondary small" th:text="${modules.size()} + ' element(s)'">0 element</span>
            </div>
            <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Code</th>
                        <th>Coefficient</th>
                        <th>Filiere</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${modules.empty}">
                        <td colspan="6" class="empty-state">Aucun module enregistre.</td>
                    </tr>
                    <tr th:each="module : ${modules}">
                        <td th:text="${module.id}"></td>
                        <td class="fw-semibold" th:text="${module.nom}"></td>
                        <td th:text="${module.code}"></td>
                        <td th:text="${module.coefficient}"></td>
                        <td th:text="${module.filiere != null ? module.filiere.nom : 'N/A'}"></td>
                        <td>
                            <a th:href="@{/admin/modules/delete/{id}(id=${module.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Supprimer ce module ?')">Supprimer</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
