<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - SGE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="fragments/header :: header"></div>

    <main class="main-container">
        <div class="page-head">
            <div>
                <p class="eyebrow">Administration</p>
                <h1 class="page-title">Gestion des notes</h1>
                <p class="page-subtitle">Saisissez les notes et laissez le systeme recalculer les moyennes.</p>
            </div>
            <a th:href="@{/admin/dashboard}" class="btn btn-soft">Dashboard</a>
        </div>

        <section class="panel mb-4">
            <div class="panel-header">
                <h2 class="panel-title">Ajouter une note</h2>
            </div>
            <div class="panel-body">
                <form th:action="@{/admin/notes/add}" method="post">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label" for="etudiantId">Etudiant</label>
                            <select id="etudiantId" name="etudiantId" class="form-select" required>
                                <option value="">Selectionner un etudiant</option>
                                <option th:each="etudiant : ${etudiants}"
                                        th:value="${etudiant.id}"
                                        th:text="${etudiant.nom + ' ' + etudiant.prenom}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="moduleId">Module</label>
                            <select id="moduleId" name="moduleId" class="form-select" required>
                                <option value="">Selectionner un module</option>
                                <option th:each="module : ${modules}"
                                        th:value="${module.id}"
                                        th:text="${module.nom + ' (' + module.code + ')'}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label" for="valeur">Note /20</label>
                            <input id="valeur" type="number" name="valeur" class="form-control"
                                   min="0" max="20" step="0.5" required>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">Ajouter</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2 class="panel-title">Liste des notes</h2>
                <span class="text-secondary small" th:text="${notes.size()} + ' element(s)'">0 element</span>
            </div>
            <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Etudiant</th>
                        <th>Module</th>
                        <th>Note</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${notes.empty}">
                        <td colspan="4" class="empty-state">Aucune note enregistree.</td>
                    </tr>
                    <tr th:each="note : ${notes}">
                        <td class="fw-semibold" th:text="${note.etudiant.nom + ' ' + note.etudiant.prenom}"></td>
                        <td th:text="${note.module.nom}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${note.valeur >= 10} ? ' badge-success' : ' badge-danger'"
                                  th:text="${#numbers.formatDecimal(note.valeur,1,2)}"></span>
                        </td>
                        <td>
                            <a th:href="@{/admin/notes/delete/{id}(id=${note.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Supprimer cette note ?')">Supprimer</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
